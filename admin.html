<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARD Content Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;700;800&display=swap');
    :root{--bg:#fdf8fb;--card:#fff;--line:#eadfda;--ink:#31404f;--muted:#6e7b87;--pink:#f7d8e6;--mint:#d8f3e5;--sky:#dcedfb;--lav:#ece4ff;--shadow:0 18px 40px rgba(68,53,75,.12)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Mali,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff7fb,#f7fbff 50%,#f9f4ef);color:var(--ink)}
    header,main{width:min(1180px,calc(100% - 24px));margin:0 auto}
    header{padding:22px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    h1,h2,h3{margin:0}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
    .login{max-width:460px;margin:48px auto;padding:24px}
    .row{display:grid;gap:8px;margin:12px 0}
    label{font-weight:700}
    input,textarea,select,button{font:inherit}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}
    textarea{min-height:160px;font-family:Mali,"Segoe UI",sans-serif}
    .btn{border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--pink);color:#5d3a48}
    .btn.secondary{background:var(--sky);color:#2f516a}
    .btn.mint{background:var(--mint);color:#2f5b45}
    .btn.lav{background:var(--lav);color:#4f476d}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap}
    .hidden{display:none!important}
    .grid{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;padding-bottom:24px}
    .nav{padding:16px;display:grid;gap:8px}
    .navbtn{width:100%;text-align:left;margin:0;border:0;border-radius:8px;padding:12px 14px;background:var(--sky);color:#2f516a;font-weight:800;cursor:pointer}
    .navbtn.active{background:var(--pink);color:#5d3a48}
    .content{padding:18px}
    .topcard,.editor{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:12px}
    .topcard h3,.editor h3{font-size:18px;margin-bottom:10px}
    .note{color:var(--muted);font-size:14px;line-height:1.5}
    .small{font-size:14px}
    .ok{color:#1c7c52;font-weight:700}
    .err{color:#b13b52;font-weight:700}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .entry{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fff7fb;margin-bottom:12px}
    .entry-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .mini{border:0;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer}
    .mini.danger{background:#fde0e6;color:#8f4350}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ARD Content Admin</h1>
      <div class="note">หน้าแก้ไขโจทย์ของเกม โดยล็อกอินก่อนเข้าใช้งาน</div>
    </div>
    <div id="status" class="note">ยังไม่ได้เข้าสู่ระบบ</div>
  </header>
  <main>
    <section id="loginView" class="panel login">
      <h2>ล็อกอิน</h2>
      <div class="row"><label>Username</label><input id="user" autocomplete="username"></div>
      <div class="row"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
      <div class="toolbar"><button class="btn" id="loginBtn">เข้าสู่ระบบ</button></div>
      <div class="note small" style="margin-top:12px">ใช้เฉพาะผู้ดูแลเนื้อหา</div>
      <div id="loginMsg" class="note"></div>
    </section>
    <section id="adminView" class="hidden">
      <div class="grid">
        <aside class="panel nav">
          <div id="navList"></div>
          <div class="actions">
            <button class="btn secondary" id="logoutBtn">ออกจากระบบ</button>
          </div>
          <div class="note small" style="margin-top:12px">ข้อมูลจะถูกเก็บใน `localStorage` ของเครื่องนี้</div>
        </aside>
        <section class="panel content">
          <div class="topcard">
            <h3 id="gameTitle"></h3>
            <div class="note" id="gameMeta"></div>
            <div class="note" id="gameSub"></div>
          </div>
          <div class="editor">
            <div class="two">
              <div class="row"><label>ชื่อเกม</label><input id="gameTitleInput"></div>
              <div class="row"><label>คำอธิบายเกม</label><input id="gameSubInput"></div>
            </div>
            <div class="actions">
              <button class="btn" id="addBtn">เพิ่มรายการ</button>
              <button class="btn mint" id="saveBtn">บันทึก</button>
              <button class="btn lav" id="exportBtn">บันทึกและคัดลอก</button>
              <button class="btn secondary" id="resetBtn">รีเซ็ตข้อมูล</button>
            </div>
          </div>
          <div id="emptyHint" class="note small">กดปุ่มเพิ่มรายการเพื่อเพิ่มโจทย์ใหม่</div>
          <div id="editorList"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="admin-inline.js" charset="utf-8"></script>
</body>
</html>
